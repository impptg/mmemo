services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mmemo
      POSTGRES_PASSWORD: local-testing-only
      POSTGRES_DB: mmemo
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["mmemo-local:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmemo"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  mmemo-local:
