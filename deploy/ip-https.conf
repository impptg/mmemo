server {
 listen 80;
 server_name 59.110.153.116;
 location /.well-known/acme-challenge/ { proxy_pass http://127.0.0.1:8788; }
 location / { return 301 https://59.110.153.116$request_uri; }
}
server {
 listen 443 ssl default_server;
 server_name 59.110.153.116;
 ssl_certificate /etc/nginx/ssl/mmemo-fullchain.pem;
 ssl_certificate_key /etc/nginx/ssl/mmemo-privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 64k;
 location /internal/ { return 404; }
 location / {
  proxy_pass http://127.0.0.1:8787;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 75s;
 }
}
